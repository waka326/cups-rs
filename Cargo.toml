[package]
name = "cups_rs"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Rust bindings for CUPS (Common UNIX Printing System)"
repository = "https://github.com/Gmin2/cups-rs"
documentation = "https://docs.rs/cups-rs"
readme = "README.md"

[dependencies]
libc = "0.2.171"
thiserror = "1.0.40"
chrono = "0.4.26"

[features]
force-cups2 = []
force-cups3 = []

# Allows the integration tests that create, submit, cancel or clean up real
# CUPS print jobs to run. Without it those tests refuse to do anything, so a
# default `cargo test` cannot reach a printer even on a machine that has one.
# See tests/integration_tests.rs for how to run them deliberately.
allow-print-job-tests = []

[dev-dependencies]
tempfile = "3.10"
serial_test = "3.1"
mockall = "0.12"

[[test]]
name = "integration"
path = "tests/integration_tests.rs"

[build-dependencies]
bindgen = "0.71.1"
pkg-config = "0.3.32"

[[example]]
name = "provider_readonly_probe"
path = "examples/provider_readonly_probe.rs"

[[example]]
name = "discover_printers"
path = "examples/discover_printers.rs"

[[example]]
name = "complete_workflow" 
path = "examples/complete_workflow.rs"

[[example]]
name = "printer_capabilities"
path = "examples/printer_capabilities.rs"

[[example]]
name = "print_with_options"
path = "examples/print_with_options.rs"
